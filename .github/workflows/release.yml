# Build and publish Radarnite Launcher 3.x; nothing is released by hand (INSTALL.md). One trigger per job:
#   push to main  -> release vX.Y.Z, made the latest release: every installed launcher updates to it
#   pull request  -> CI: version and installer, nothing published (any base branch, feat/3.0 included)
#   Run workflow  -> like a push: main publishes the release; another branch only builds (no prereleases)
# A push to any other branch runs nothing: its PR does.
# tools/ci-version.sh picks the version (last stable tag + 1 patch, or VERSION when higher) and writes the notes.
# Everything builds on ubuntu-latest: zig c++ for the core and the window, makensis for the installer; the backend is
# backend/server.mjs on the Node runtime, which comes with the rest of the payload from the pinned 2.2.1 installer
# (tools/payload-from-release.sh).
# CI only compiles and checks: the test suites are run by hand before a release (native/core/test/README.md,
# `just release-selftest`).
# Every action is pinned to a commit SHA (its tag in a comment). Third-party actions run only in the read-only jobs:
# the one job that can write (publish) runs gh and GitHub's download-artifact alone.
name: release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# one run at a time per branch (per PR for pull requests). A publishing run is never cancelled: the version is fixed
# when it starts and N must not be reused; while one runs GitHub keeps only the newest waiting push, so back-to-back
# merges publish the latest main once. A PR's run is replaced by its next push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ZIG_VERSION: 0.16.0
  # release.sh bans the builder's account name as an identity and scrubs it out of the prebuilt payload. On a runner
  # that name is "runner", which is also part of type names in the .NET payload (RegexRunner) that the scrub would
  # rewrite, so release.sh sees this neutral name (absent from the payload) instead. HOME
  # (/home/runner), the checkout, every input folder and the generic '/home/' stay banned.
  RN_CI_USER: rlcibuilder

jobs:
  meta:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Version, tag and release notes
        id: v
        run: |
          tools/ci-version.sh --notes "$RUNNER_TEMP/notes.md" | tee "$RUNNER_TEMP/version.txt"
          { echo '### Version'; echo '```'; cat "$RUNNER_TEMP/version.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes
          path: ${{ runner.temp }}/notes.md
          if-no-files-found: error

  build:
    name: Installer
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: makensis and 7z
        run: |
          pkgs=(nsis)
          command -v 7z >/dev/null || pkgs+=(p7zip-full)
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends "${pkgs[@]}" >/dev/null
          echo "makensis $(makensis -VERSION), zig $(zig version)"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - name: Game start helper (dotnet publish, self-contained win-x64 single file)
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: 1
          DOTNET_NOLOGO: 1
        run: |
          dotnet publish play/RadarnitePlay.csproj -c Release -o play/out
          [ "$(ls -A play/out)" = radarnite-play.exe ] || { echo "::error::play/out must hold radarnite-play.exe alone: $(ls -A play/out)"; exit 1; }
          echo "radarnite-play.exe: $(stat -c %s play/out/radarnite-play.exe) bytes"
      - name: Core and window (zig c++, x86_64-windows-gnu)
        env:
          RN_VERSION: ${{ env.VERSION }}
        run: |
          native/core/build.sh out
          mkdir -p native/ui/out
          native/ui/build.sh out/RadarniteLauncher.exe
      - name: Body sliders DLL (zig cc, patches/fnbody.dll; ships, unlike the payload sources below)
        run: |
          mkdir -p pakpatch/out
          zig cc -target x86_64-windows-gnu -O2 -shared -s -o pakpatch/out/fnbody.dll pakpatch/fnbody.c -luser32
          echo "fnbody.dll: $(stat -c %s pakpatch/out/fnbody.dll) bytes"
      - name: Payload from the pinned 2.2.1 installer
        run: tools/payload-from-release.sh "$RUNNER_TEMP/payload"
      - name: Payload sources built here (informational, nothing of it ships)
        continue-on-error: true
        run: |
          ref="$RUNNER_TEMP/payload"   # 2.2.1's redirect/ and patches/, as shipped
          o="$RUNNER_TEMP/src-check"; mkdir -p "$o"
          zig cc -target x86_64-windows-gnu -O2 -shared -s -o "$o/fnpakpatch.dll" pakpatch/fnpakpatch.c
          zig cc -target x86_64-windows-gnu -O2 -shared -s -o "$o/fnredirect.dll" redirect/fnredirect.c
          echo '### Payload sources' >> "$GITHUB_STEP_SUMMARY"
          for p in fnpakpatch.dll:patches/fnpakpatch.dll.off fnredirect.dll:redirect/fnredirect.dll; do
            if cmp -s "$o/${p%%:*}" "$ref/${p#*:}"; then r="identical to"; else r="differs from"; fi
            echo "- ${p%%:*}: builds with zig $(zig version), $r 2.2.1's ${p#*:} (the 2.2.1 one ships)" | tee -a "$GITHUB_STEP_SUMMARY"
          done
      - name: Installer and .sha256 (release.sh build, privacy gate)
        env:
          USER: ${{ env.RN_CI_USER }}
          LOGNAME: ${{ env.RN_CI_USER }}
          RN_PRIVACY_BAN: ${{ secrets.RN_PRIVACY_BAN }}
        run: >-
          tools/release.sh build --version "$VERSION" --launcher native/ui/out/RadarniteLauncher.exe
          --payload "$RUNNER_TEMP/payload" --out dist --makensis "$(command -v makensis)"
          --play play/out/radarnite-play.exe --fnbody pakpatch/out/fnbody.dll
      - name: Program folder zip (the installer's content; no .sha256 asset, the updaters take any)
        run: |
          x="$RUNNER_TEMP/program"; rm -rf "$x"
          7z x -y -bso0 -bsp0 -o"$x" "dist/RadarniteLauncherSetup-$VERSION.exe"
          # no NSIS internals, and no uninstaller: run from an unzipped folder it would remove the installed one's keys
          rm -rf "$x/\$PLUGINSDIR" "$x/Uninstall Radarnite Launcher.exe"
          (cd "$x" && 7z a -tzip -mx=9 -bso0 -bsp0 "$GITHUB_WORKSPACE/dist/RadarniteLauncher-$VERSION.zip" '*')
          stat -c '%10s %n' dist/*
          { echo '### Installer'; echo '```'; stat -c '%10s %n' dist/*; cat "dist/RadarniteLauncherSetup-$VERSION.exe.sha256"; echo; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish
    needs: [meta, build]
    if: github.event_name != 'pull_request' && needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.meta.outputs.version }}
      TAG: ${{ needs.meta.outputs.tag }}
      PRERELEASE: ${{ needs.meta.outputs.prerelease }}
    steps:
      - name: Guards (only main publishes a release; the tag is new)
        run: |
          if [ "$PRERELEASE" = true ]; then
            [[ "$VERSION" == *-* ]] || { echo "::error::prerelease $VERSION has no prerelease part"; exit 1; }
          else
            [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::$GITHUB_REF must not publish the release $TAG"; exit 1; }
            [[ "$VERSION" != *-* ]] || { echo "::error::release $VERSION has a prerelease part"; exit 1; }
          fi
          if out=$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" 2>&1); then echo "::error::tag $TAG already exists"; exit 1; fi
          grep -q 'HTTP 404' <<<"$out" || { echo "::error::could not check tag $TAG: $out"; exit 1; }
          echo "LATEST_BEFORE=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notes
          path: notes
      - name: Check the assets
        run: |
          exe="RadarniteLauncherSetup-$VERSION.exe"
          want="$(printf '%s\n' "$exe" "$exe.sha256" "RadarniteLauncher-$VERSION.zip" | sort)"
          got="$(find dist -mindepth 1 -printf '%P\n' | sort)"
          [ "$got" = "$want" ] || { echo "::error::unexpected assets: ${got//$'\n'/ }"; exit 1; }
          [ "$(cat "dist/$exe.sha256")" = "$(sha256sum "dist/$exe" | cut -d' ' -f1)  $exe" ] || { echo "::error::$exe.sha256 does not match"; exit 1; }
      - name: Draft with the assets, then publish
        run: |
          if [ "$PRERELEASE" = true ]; then latest=false; else latest=true; fi
          id=$(gh api "repos/$GH_REPO/releases" -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" -f name="Radarnite Launcher $VERSION" \
            -F body=@notes/notes.md -F draft=true -F prerelease="$PRERELEASE" -f make_latest="$latest" --jq .id)
          echo "DRAFT_ID=$id" >> "$GITHUB_ENV"
          for f in dist/*; do
            gh api -X POST "https://uploads.github.com/repos/$GH_REPO/releases/$id/assets?name=$(basename "$f")" \
              -H 'Content-Type: application/octet-stream' --input "$f" --jq '"uploaded \(.name) (\(.size) bytes)"'
          done
          gh api -X PATCH "repos/$GH_REPO/releases/$id" -F draft=false -F prerelease="$PRERELEASE" -f make_latest="$latest" --jq '"published \(.html_url)"'
      - name: Check what the updaters see
        run: |
          gh api "repos/$GH_REPO/releases/tags/$TAG" | jq -e --argjson pre "$PRERELEASE" '.draft == false and .prerelease == $pre' >/dev/null \
            || { echo "::error::$TAG is not published with prerelease=$PRERELEASE"; exit 1; }
          sha=$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)
          [ "$sha" = "$GITHUB_SHA" ] || { echo "::error::$TAG points at $sha, not $GITHUB_SHA"; exit 1; }
          latest=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)
          if [ "$PRERELEASE" = true ]; then want="$LATEST_BEFORE"; else want="$TAG"; fi
          [ "$latest" = "$want" ] || { echo "::error::releases/latest is $latest, expected $want"; exit 1; }
          exe="RadarniteLauncherSetup-$VERSION.exe"; d="$RUNNER_TEMP/check"; mkdir -p "$d"
          for f in "$exe" "$exe.sha256"; do curl -sSfL --retry 3 -o "$d/$f" "https://github.com/$GH_REPO/releases/download/$TAG/$f"; done
          got=$(sha256sum "$d/$exe" | cut -d' ' -f1)
          [ "$got" = "$(head -c 64 "$d/$exe.sha256")" ] || { echo "::error::downloaded $exe does not match its .sha256"; exit 1; }
          { echo "### Published $TAG"; echo "- prerelease: $PRERELEASE, releases/latest: $latest"; echo "- $exe sha256 $got (downloaded and checked)"; } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove this run's draft when publishing failed
        if: failure() && env.DRAFT_ID != ''
        run: |
          if [ "$(gh api "repos/$GH_REPO/releases/$DRAFT_ID" --jq .draft)" = true ]; then
            gh api -X DELETE "repos/$GH_REPO/releases/$DRAFT_ID" && echo "deleted draft $DRAFT_ID"
          fi
