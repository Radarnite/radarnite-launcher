<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radarnite Launcher</title>
<style>
/* ===== Design system =====================================================================================
   Colours: Radarnite tokens (radarnite-wt/hub2/dashboard/css/tokens.css), dark theme.
   Type: Inter (UI) + Inter Tight 900 italic (display), sizes 11/12/13/15/20/28/56.
   Spacing: 4-px grid (4 8 12 16 20 24 32). Radii: 6 (small), 8 (controls), 12 (cards), 999 (pills).
   Control heights: 28 (compact), 34 (default), 52 (primary action). Title bar 40. Launch bar 72. Rail 264.
   Motion: 120/180 ms, ease var(--ease); everything static at rest; prefers-reduced-motion removes it. */
@font-face{font-family:Inter;src:url(fonts/Inter-var-latin.woff2) format('woff2');font-weight:100 900;font-style:normal}
@font-face{font-family:"Inter Tight";src:url(fonts/InterTight-900i-latin.woff2) format('woff2');font-weight:900;font-style:italic}
:root{
  --bg:#101114;--bg2:#181A1F;--surface:#202228;--surface2:#24262C;--hover:#292C33;--line:#303238;--line2:#25272C;--l2:#3A3D44;
  --text:#F5F6F7;--ink2:#D4D4D8;--muted:#A1A1AA;--dim:#71717A;
  --ok:#6CCB8F;--warn:#E3B55B;--bad:#E5646E;--ok-bg:rgba(108,203,143,.12);--warn-bg:rgba(227,181,91,.12);--bad-bg:rgba(229,100,110,.12);
  --fn:Inter,system-ui,"Segoe UI",sans-serif;--fh:"Inter Tight",Inter,system-ui,sans-serif;--mono:"Cascadia Mono",Consolas,ui-monospace,"SF Mono",Menlo,monospace;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--s8:32px;
  --r1:6px;--r2:8px;--r3:12px;
  --h-c:28px;--h:34px;--h-p:52px;--tb:40px;--lb:72px;--rail:264px;
  --ease:cubic-bezier(.2,.7,.2,1);--t1:120ms;--t2:180ms;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:400 13px/1.45 var(--fn);-webkit-font-smoothing:antialiased;overflow:hidden;user-select:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
.i{width:16px;height:16px;flex:none;display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px;border:3px solid transparent;background-clip:padding-box}::-webkit-scrollbar-thumb:hover{background:var(--l2);background-clip:padding-box;border:3px solid transparent}

.app{display:grid;grid-template-rows:var(--tb) 1fr;height:100%}

/* ===== Title bar (custom frame) ===== */
.tb{display:flex;align-items:stretch;background:var(--bg);border-bottom:1px solid var(--line2);app-region:drag;-webkit-app-region:drag}
.tb .mark{display:flex;align-items:center;gap:var(--s2);padding:0 var(--s3) 0 var(--s4);min-width:0}
.tb .mark img{width:20px;height:20px;border-radius:5px;flex:none}
.tb .mark span{font-weight:600;font-size:13px;letter-spacing:-.01em;white-space:nowrap}
.tb .mark span b{font-weight:600;color:var(--muted)}
.tb .safe{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:12px;white-space:nowrap;padding:0 var(--s2);overflow:hidden}
.tb .sp{flex:1}
.wc{display:flex;app-region:no-drag;-webkit-app-region:no-drag}
.wc button{width:46px;height:100%;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;transition:background var(--t1),color var(--t1)}
.wc button:hover{background:var(--hover);color:var(--text)}
.wc button.x:hover{background:#C42B1C;color:#fff}
.wc button:focus-visible{outline-offset:-3px}
.wc svg{width:10px;height:10px}
body.max .wc .mx-on{display:none}body:not(.max) .wc .mx-off{display:none}
body.inactive .tb .mark span,body.inactive .wc button{color:var(--dim)}

/* ===== Body: rail + workspace ===== */
.body{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:0}
.rail{display:flex;flex-direction:column;min-height:0;background:var(--bg);border-right:1px solid var(--line2)}
.rail-h{display:flex;align-items:center;justify-content:space-between;height:48px;padding:0 var(--s3) 0 var(--s4)}
.cap{font-size:11px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
.list{flex:1;overflow:auto;padding:0 var(--s2) var(--s2)}
.bi{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px var(--s2);width:100%;padding:10px var(--s3);border:0;border-radius:var(--r2);background:transparent;text-align:left;transition:background var(--t1)}
.bi+.bi{margin-top:2px}
.bi:hover{background:var(--bg2)}
.bi.on{background:var(--surface)}
.bi .v{font:italic 900 20px/1 var(--fh);letter-spacing:-.01em}
.bi .s{grid-column:1;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bi .d{grid-row:1/3;grid-column:2}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
.rail-f{padding:var(--s3) var(--s4);border:0;border-top:1px solid var(--line2);background:none;font:inherit;text-align:left;cursor:pointer;color:var(--dim);font-size:12px;display:flex;align-items:center;gap:var(--s2);min-width:0;width:100%}
.rail-f:hover{color:var(--text)}
.rail-f span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{margin:var(--s2);padding:var(--s5) var(--s4);border:1px dashed var(--line);border-radius:var(--r3);color:var(--muted);font-size:12.5px;text-align:center}

.ws{display:grid;grid-template-rows:1fr auto auto;grid-template-columns:minmax(0,1fr);min-width:0;min-height:0;background:var(--bg2)}
.scroll{overflow:auto;min-height:0}
.content{max-width:880px;margin:0 auto;padding:var(--s6) var(--s8) var(--s6);display:flex;flex-direction:column;gap:var(--s6)}

/* hero */
.hero{display:grid;grid-template-columns:1fr auto;gap:var(--s4);align-items:start}
.hero .ver{font:italic 900 56px/.9 var(--fh);letter-spacing:-.025em}
.hero .sea{font-size:15px;font-weight:600;margin-top:var(--s2)}
.hero .meta{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line2);border-radius:var(--r3);background:var(--bg)}
.cell{display:flex;flex-direction:column;gap:2px;padding:var(--s3) var(--s4);min-width:0}
.cell+.cell{border-left:1px solid var(--line2)}
.cell .k{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.cell .val{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.val.ok{color:var(--ok)}.val.warn{color:var(--warn)}.val.bad{color:var(--bad)}
.chip{display:inline-flex;align-items:center;gap:var(--s2);height:var(--h-c);padding:0 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line2);font-size:12px;color:var(--ink2);white-space:nowrap}
.chip .k{color:var(--muted)}
.chip.ok{border-color:rgba(108,203,143,.25)}.chip.warn{border-color:rgba(227,181,91,.3)}.chip.bad{border-color:rgba(229,100,110,.35)}
.chip .val.ok{color:var(--ok)}.chip .val.warn{color:var(--warn)}.chip .val.bad{color:var(--bad)}
.notice{display:flex;gap:var(--s3);align-items:flex-start;padding:var(--s3) var(--s4);border-radius:var(--r3);font-size:12.5px;line-height:1.5}
.notice.warn{background:var(--warn-bg);color:#F1D9A6}.notice.bad{background:var(--bad-bg);color:#F4C0C5}
.notice .i{margin-top:2px}
.notice b{color:var(--text);font-weight:600}
.notice button{margin-left:auto;flex:none}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);height:var(--h);padding:0 var(--s3);border-radius:var(--r2);border:1px solid var(--line);background:var(--surface);color:var(--text);font-weight:600;font-size:13px;white-space:nowrap;transition:background var(--t1),border-color var(--t1),opacity var(--t1)}
.btn:hover{background:var(--hover);border-color:var(--l2)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}.btn.ghost:hover{background:var(--hover);color:var(--text)}
.btn.icon{width:var(--h);padding:0}
.btn.sm{height:var(--h-c);padding:0 10px;font-size:12px}
.btn.sm.icon{width:var(--h-c)}
.btn[disabled]{opacity:.45;pointer-events:none}

/* menus */
.menu{position:relative}
.pop{position:absolute;right:0;top:calc(100% + 6px);min-width:240px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r3);padding:var(--s1);box-shadow:0 16px 40px rgba(0,0,0,.5);display:none;z-index:20}
.pop.up{top:auto;bottom:calc(100% + 6px)}
.pop.left{right:auto;left:0}
.menu.open .pop{display:block}
.pop button{display:flex;width:100%;align-items:center;gap:10px;height:var(--h);padding:0 10px;border:0;border-radius:var(--r1);background:transparent;font-size:13px;text-align:left;white-space:nowrap}
.pop button:hover,.pop button:focus-visible{background:var(--hover);outline:none}
.pop button small{margin-left:auto;padding-left:var(--s4);color:var(--dim);font-size:11.5px}
.pop hr{border:0;border-top:1px solid var(--line);margin:var(--s1) 6px}

/* settings */
.card{background:var(--bg);border:1px solid var(--line2);border-radius:var(--r3)}
.sect{padding:var(--s5)}
.sect+.sect{border-top:1px solid var(--line2)}
.lbl{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:var(--s2)}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2)}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:var(--s1);padding:var(--s3);border-radius:var(--r2);border:1px solid var(--line2);background:var(--bg2);text-align:left;transition:border-color var(--t1),background var(--t1);min-width:0}
.mode:hover{border-color:var(--line);background:var(--surface)}
.mode .t{display:flex;align-items:center;gap:var(--s2);font-weight:600;font-size:13px}
.mode .d{font-size:12px;color:var(--muted);line-height:1.4}
.mode.on{border-color:#fff;background:var(--surface)}
.mode.on .t .i{color:#fff}
.mode[aria-disabled=true]{opacity:.45}
.modes.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.mode.info,.mode.info:hover{border-color:var(--line2);background:var(--bg2);cursor:default}.mode.info .d b{color:var(--ink2);font-weight:600}.mhint b{color:var(--ink2);font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4) var(--s6)}
.field .in{width:100%;height:var(--h);border-radius:var(--r2);border:1px solid var(--line);background:var(--bg2);padding:0 var(--s3);font-weight:500;outline:none;transition:border-color var(--t1);user-select:text}
.field .in:hover{border-color:var(--l2)}.field .in:focus{border-color:var(--muted)}
.field .help{font-size:12px;color:var(--dim);margin-top:6px}
.num{display:flex;align-items:center;gap:var(--s3)}
.step{display:inline-flex;align-items:center;height:var(--h);border:1px solid var(--line);border-radius:var(--r2);background:var(--bg2)}
.step button{width:30px;height:100%;border:0;background:transparent;color:var(--muted);display:grid;place-items:center}
.step button:hover{color:var(--text)}
.step input{width:36px;border:0;background:transparent;text-align:center;font-weight:600;font-variant-numeric:tabular-nums;outline:none}
.range{flex:1;-webkit-appearance:none;appearance:none;height:4px;border-radius:4px;background:var(--line);outline:none;min-width:60px}
.range::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;border:0;box-shadow:0 0 0 4px rgba(255,255,255,.08)}
.toggles{display:grid;grid-template-columns:1fr 1fr;gap:0 var(--s6)}
.tg{display:flex;width:100%;align-items:center;justify-content:space-between;gap:var(--s3);min-height:var(--h);border:0;background:transparent;padding:0;text-align:left}
.tg span{font-size:13px;color:var(--ink2)}
.tg small{display:block;color:var(--dim);font-size:11.5px}
.sw{width:32px;height:18px;border-radius:999px;background:var(--l2);position:relative;flex:none;transition:background var(--t2) var(--ease)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:12px;height:12px;border-radius:50%;background:#fff;transition:transform var(--t2) var(--ease)}
.tg[aria-checked=true] .sw{background:var(--ok)}.tg[aria-checked=true] .sw::after{transform:translateX(14px)}
.tg[aria-disabled=true]{opacity:.5;pointer-events:none}
.card.dis{opacity:.5;pointer-events:none}
/* invisible resize edges (native sizing loop through the host) */
.incl{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s4);min-height:var(--h);align-items:center;color:var(--ink2);font-size:13px}
.incl+.tg{margin-top:var(--s2)}
.incl span{display:inline-flex;align-items:center;gap:6px}.incl .i{color:var(--ok)}
.mhint{font-size:12px;color:var(--muted);margin-top:var(--s2)}
.mnote{display:flex;align-items:center;gap:var(--s2);color:var(--muted);font-size:12.5px}
.toggles+.mnote{margin-top:var(--s3);padding:var(--s2) var(--s3);border-radius:var(--r2);background:var(--surface);align-items:flex-start}
.mnote .i{flex:none;margin-top:1px}.mnote b{color:var(--ink2);font-weight:600}
.mnote.warn{background:var(--warn-bg);color:var(--ink2)}.mnote.warn .i{color:var(--warn)}
.phase{color:var(--muted)}.phase.ok{color:var(--ink2)}.phase.bad{color:#F4C0C5}

/* ===== Launch bar ===== */
.lbar{display:flex;align-items:center;gap:var(--s4);height:var(--lb);padding:0 var(--s6);border-top:1px solid var(--line2);background:var(--bg)}
.lstat{display:flex;align-items:center;gap:var(--s3);min-width:0;flex:1}
.lstat .txt{flex:1;min-width:0;overflow:hidden}
.lstat .a{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lstat .b{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.steps .st{display:inline-flex;align-items:center;gap:6px}
.steps .sep{width:16px;height:1px;background:var(--line)}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--l2);border-top-color:#fff;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.act{position:relative;display:inline-flex;align-items:center;gap:var(--s2);height:var(--h);padding:0 var(--s3);border-radius:var(--r2);border:1px solid var(--line);background:transparent;color:var(--muted);font-weight:600;font-size:12.5px;transition:background var(--t1),color var(--t1)}
.act:hover,.act[aria-expanded=true]{background:var(--surface);color:var(--text)}
.act .badge{min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--surface2);color:var(--ink2);font-size:11px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.act .badge.bad{background:var(--bad);color:#fff}.act .badge.warn{background:var(--warn);color:#111}
.play{position:relative;overflow:hidden;isolation:isolate;display:inline-flex;align-items:center;justify-content:center;gap:10px;height:var(--h-p);min-width:196px;padding:0 var(--s6);border:0;border-radius:var(--r3);background:#fff;color:#101114;font:italic 900 24px/1 var(--fh);text-transform:uppercase;letter-spacing:-.01em;transition:background var(--t1),transform var(--t1) var(--ease),box-shadow var(--t1)}
.play:hover{box-shadow:0 0 0 3px rgba(255,255,255,.16)}
.play:active{transform:scale(.985)}
.play .i{width:18px;height:18px}
/* Radarnite sheen (hub2 .botnav::after): crosses the button on hover and a few times when it becomes ready; nothing runs at rest */
.play::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(105deg,transparent 30%,rgba(16,17,20,.10) 46%,rgba(16,17,20,.16) 50%,rgba(16,17,20,.10) 54%,transparent 70%);transform:translateX(-120%)}
.play:hover::after{animation:sheen .7s var(--ease)}
.play.greet::after{animation:sheen 1.1s var(--ease) .3s 2}
@keyframes sheen{from{transform:translateX(-120%)}to{transform:translateX(120%)}}
.play.stop{background:var(--surface);color:var(--text);border:1px solid var(--line);font:600 14px/1 var(--fn);text-transform:none;letter-spacing:0;min-width:150px}
.play.stop:hover{background:var(--hover)}
.play[disabled]{background:var(--surface);color:var(--dim);pointer-events:none}

/* ===== Activity (logs) ===== */
.activity{display:none;flex-direction:column;height:var(--act-h,260px);min-height:140px;max-height:70vh;border-top:1px solid var(--line2);background:var(--bg)}
body.act-open .activity{display:flex}
.grip{height:6px;margin-top:-3px;cursor:ns-resize;flex:none}
.act-h{display:flex;align-items:center;gap:var(--s2);padding:var(--s2) var(--s6) var(--s2)}
.act-h .ttl{font-weight:600;font-size:13px;margin-right:var(--s2)}
.fseg{display:flex;background:var(--bg2);border:1px solid var(--line2);border-radius:var(--r2);padding:2px;gap:2px}
.fseg button{height:24px;padding:0 10px;border:0;border-radius:6px;background:transparent;color:var(--muted);font-size:12px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.fseg button.on{background:var(--hover);color:var(--text)}
.fseg button .n{color:var(--dim);font-variant-numeric:tabular-nums}
.search{height:var(--h-c);width:180px;border-radius:var(--r2);border:1px solid var(--line);background:var(--bg2);padding:0 10px;font-size:12px;outline:none;user-select:text}
.search:focus{border-color:var(--muted)}
.lines{flex:1;overflow:auto;padding:0 var(--s6) var(--s3);font:12px/1.6 var(--mono);user-select:text}
.ln{display:grid;grid-template-columns:62px 18px 1fr;gap:var(--s2);align-items:start;padding:1px 0}
.ln .ts{color:var(--dim)}
.ln .lv{display:grid;place-items:center;height:19px}
.ln .lv .dot{width:6px;height:6px}
.ln .msg{color:var(--ink2);white-space:pre-wrap;word-break:break-word}
.ln.warn .msg{color:#F1D9A6}.ln.bad .msg{color:#F4C0C5}
.ln.key .msg{color:var(--text);font-weight:600}
.noact{color:var(--dim);font-family:var(--fn);padding:var(--s4) 0}

/* toasts */
.toasts{position:fixed;right:var(--s6);bottom:calc(var(--lb) + var(--s4));display:flex;flex-direction:column;gap:var(--s2);z-index:30;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:var(--s3);max-width:420px;padding:10px var(--s4);border-radius:var(--r3);background:var(--surface);border:1px solid var(--line);box-shadow:0 12px 30px rgba(0,0,0,.45);font-size:12.5px;animation:tin var(--t2) var(--ease)}
@keyframes tin{from{opacity:0;transform:translateY(6px)}}

/* skeleton while the host loads (Radarnite .sk shimmer; only while loading) */
.sk{background:linear-gradient(90deg,var(--bg2) 25%,var(--surface) 50%,var(--bg2) 75%);background-size:800px 100%;animation:shimmer 1.4s infinite linear;border-radius:var(--r2)}
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}

/* ===== Cosmetics of the current Fortnite (import panel) ===== */
.pcard{display:flex;align-items:center;gap:var(--s4);padding:var(--s4) var(--s5)}
.pcard .t{font-weight:600;font-size:13px}.pcard .d{font-size:12px;color:var(--muted);margin-top:2px}
.pcard .sp{flex:1}
/* ===== Cosmetics of the current Fortnite: radarnite.com's Browse all, rule for rule (bar .frow/.sel/.chip/.search,
   popups #mpnl/#fpnl/.pnl.menu, title .sec, .grid of .card), scoped to .port; same tokens as the web ===== */
.port{position:absolute;inset:0;z-index:15;display:none;flex-direction:column;background:var(--bg);
  --n-ink:#F5F6F7;--n-mut:#A1A1AA;--n-line:#303238;--n-surf:#202228;--n-on:#111216;--n-bg:#101114;--n-panel:#181A1F;--n-dim:#71717A;--n-l3:#55585F;--n-hov:#292C33;--n-l2:#3A3D44;--n-max:#FFFFFF;--n-l3b:#55575F;--n-oncount:#5A5D66;--n-l25b:#45484F;--n-surf2:#24262C;
  --accent:#E5E7EB;--accent-strong:#FFFFFF;--tr:14px;--ease:cubic-bezier(.2,.7,.2,1)}
body.port-open .port{display:flex}
.ws{position:relative}
.port-h{display:flex;align-items:center;gap:var(--s3);padding:var(--s4) var(--s6) 0}
.port-h .ttl{font:italic 900 28px/1 var(--fh);letter-spacing:-.02em;text-transform:uppercase}

<div class="app">

            <button data-cmd="refresh" role="menuitem"><svg class="i"><use href="#i-refresh"/></svg>Rescan builds</button>

          <button class="chip popbtn" id="pfbtn" data-pop="pfpnl" aria-haspopup="dialog" aria-expanded="false"><svg class="i" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 4.5h6M11.5 4.5h2M2.5 11.5h2M7.5 11.5h6"/><circle cx="10" cy="4.5" r="1.5"/><circle cx="6" cy="11.5" r="1.5"/></svg>Filters<b class="n" id="pfbn"></b></button>

        </div></div>

<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const send = (cmd, data = {}) => window.chrome?.webview ? window.chrome.webview.postMessage({ cmd, ...data }) : (window.__sent = (window.__sent || []).concat([{ cmd, ...data }]));
const S = { builds: null, config: {}, selected: null, session: { state: 'idle' }, root: '', logs: [], filter: 'all', q: '', unseen: 0, unseenLevel: '' };
const MODES = {
  lobby: { name: 'Lobby', icon: 'i-lobby', d: 'Lobby and locker only. Every cosmetic and style of the build.' },
  practice: { name: 'Practice', icon: 'i-build', d: 'Local match alone. Infinite materials and ammo, 0 ping.' },
  bots: { name: 'Bots', icon: 'i-bots', d: 'Battle Royale on 127.0.0.1 with bots: bus, storm, loot.' },
};
const SUP = { Yes: ['ok', 'Ready'], Experimental: ['warn', 'Experimental'], No: ['bad', 'Not supported'] };

function season(major, minor) {
  if (!major) return 'Unknown version';
  if (major <= 10) return `Chapter 1 · Season ${major === 1 ? (minor < 8 ? 1 : 2) : major}`;
  if (major <= 18) return `Chapter 2 · Season ${major - 10}`;
  if (major <= 22) return `Chapter 3 · Season ${major - 18}`;
  if (major <= 26) return `Chapter 4 · Season ${major - 22}`;
  if (major === 27) return 'Chapter 4 · Season OG';
  if (major <= 31) return `Chapter 5 · Season ${major - 27}`;
  return `Fortnite ${major}.x`;
}
const sel = () => S.builds?.find((b) => b.name === S.selected) || null;
const level = (b) => (b.lobby === 'No' ? 'bad' : b.firewall !== 'OK' || b.lobby === 'Experimental' || !b.cosmetics ? 'warn' : 'ok');
const matchOk = (b) => b && b.match !== 'No' && b.matchServer;
const busy = () => ['launching', 'running', 'stopping'].includes(S.session.state);

/* ---------- rail ---------- */
function renderRail() {
  const list = $('#list');
  if (!S.builds) { list.innerHTML = [1, 2, 3].map(() => '<div class="sk" style="height:52px;margin:2px 0"></div>').join(''); return; }
  if (!S.builds.length) { list.innerHTML = '<div class="empty">No builds yet.<br>Add a downloaded zip or a folder with <b>+</b>.</div>'; return; }
  list.innerHTML = S.builds.map((b) => `
    <button class="bi${b.name === S.selected ? ' on' : ''}" role="option" aria-selected="${b.name === S.selected}" data-build="${esc(b.name)}" title="${esc(b.version)} · ${esc(season(b.major, b.minor))}">
      <span class="v">${esc(b.version)}</span><span class="dot d ${level(b)}"></span><span class="s">${esc(season(b.major, b.minor))}</span>
    </button>`).join('');
  $('#root').textContent = S.root || '';
  $('#railFoot').title = 'Builds folder: ' + (S.root || '') + ' (click to change)';
}

/* ---------- workspace ---------- */
function cell(icon, k, val, cls, title) {
  return `<div class="cell" title="${esc(title || '')}"><span class="k"><svg class="i"><use href="#${icon}"/></svg>${k}</span><span class="val ${cls}">${val}</span></div>`;
}
function renderContent() {
  const el = $('#content'), b = sel(), c = S.config;
  if (!S.builds) { el.innerHTML = '<div class="sk" style="height:110px"></div><div class="sk" style="height:220px"></div>'; return; }
  if (!b) {
    el.innerHTML = `<div class="hero"><div><div class="ver" style="font-size:40px">No build</div><div class="sea">Add a Fortnite build to start</div>
      <div class="meta">Builds live in ${esc(S.root)}. A downloaded zip is extracted there; a folder is moved or copied.</div></div></div>
      <div class="row" style="display:flex;gap:8px"><button class="btn" data-cmd="addZip"><svg class="i"><use href="#i-zip"/></svg>Add from zip…</button><button class="btn" data-cmd="addFolder"><svg class="i"><use href="#i-folder"/></svg>Add from folder…</button><button class="btn" data-cmd="chooseRoot"><svg class="i"><use href="#i-folder"/></svg>Change builds folder…</button></div>`;
    return;
  }
  const lob = SUP[b.lobby] || SUP.No, mat = b.matchServer ? (SUP[b.match] || SUP.No) : ['bad', 'match server missing'];
  const fwOk = b.firewall === 'OK';
  const notices = [];
  if (b.lobby === 'No') notices.push(['bad', `<b>Fortnite ${esc(b.version)} cannot be launched.</b> ${esc(b.lobbyWhy)}.`, '']);
  else {
    if (!fwOk) notices.push(['warn', `<b>Firewall rules missing.</b> ${esc(b.firewall)}. They are created before launch (administrator prompt).`, '<button class="btn sm" data-cmd="firewall">Create now</button>']);
    if (!b.cosmetics) notices.push(['warn', '<b>No cosmetics list yet.</b> Only the default items will show in the locker.', '<button class="btn sm" data-cmd="cosmetics">Generate</button>']);
  }
  const hasMatch = matchOk(b);
  const modeCards = `
    <div class="mode info"><span class="t"><svg class="i"><use href="#i-build"/></svg>Practice</span><span class="d">Pick <b>Creative / Playground</b> in the game: alone, infinite materials and ammo, 0 ping.</span></div>
    <div class="mode info"><span class="t"><svg class="i"><use href="#i-bots"/></svg>Battle Royale</span><span class="d">Pick <b>Solo, Duos, Trios or Squads</b>: bus, storm and loot, with ${c.bots ?? 20} bots.</span></div>`;
  const tg = (key, label, sub, disabled, forced) => `
    <button class="tg" role="switch" data-flag="${key}" aria-checked="${forced ?? !!c[key]}" ${disabled ? 'aria-disabled="true"' : ''}>
      <span>${label}${sub ? `<small>${sub}</small>` : ''}</span><i class="sw"></i></button>`;
  const botsCount = `<div class="field"><span class="lbl">Bots</span>
        <div class="num"><div class="step"><button data-step="-1" aria-label="Fewer bots">−</button><input id="bots" inputmode="numeric" aria-label="Number of bots" value="${c.bots ?? 20}"><button data-step="1" aria-label="More bots">+</button></div>
        <input class="range" type="range" min="0" max="99" value="${c.bots ?? 20}" id="botsR" aria-label="Number of bots"></div>
        <div class="help">0–99. 20 suits this PC.</div></div>`;
  const botToggles = `${tg('botsAI', "Bots use the game's AI", 'Experimental: crashes the match on 17.50')}${tg('lateGame', 'Late game', 'Small storm, shields')}${tg('infiniteMaterials', 'Infinite materials', 'Battle Royale (practice always has them)')}${tg('infiniteAmmo', 'Infinite ammo', 'Battle Royale (practice always has it)')}`;
  const botsNote = c.botsAI
    ? `<div class="mnote warn"><svg class="i"><use href="#i-warn"/></svg><span><b>Bot AI is on.</b> On ${esc(b.version)} the game's bot AI crashes the match server a few seconds after it starts. Turn it off to play.</span></div>`
    : `<div class="mnote"><svg class="i"><use href="#i-bots"/></svg><span><b>Bots have no AI.</b> They drop from the bus and land, but they do not loot or fight.</span></div>`;

  el.innerHTML = `
    <section class="hero">
      <div style="min-width:0"><div class="ver">${esc(b.version)}</div><div class="sea">${esc(season(b.major, b.minor))}</div>
        <div class="meta" title="${esc(b.dir || '')}">CL ${b.cl} · Unreal Engine ${esc(b.engine)} · ${esc(b.dir || b.name)}</div></div>
      <div class="menu" id="buildMenu">
        <button class="btn sm" data-toggle="buildMenu" aria-haspopup="menu" title="Build actions"><svg class="i"><use href="#i-more"/></svg>Build</button>
        <div class="pop" role="menu">
          <button data-cmd="cosmetics" role="menuitem"><svg class="i"><use href="#i-refresh"/></svg>Regenerate cosmetics</button>
          <button data-cmd="firewall" role="menuitem"><svg class="i"><use href="#i-fw"/></svg>Recreate firewall rules<small>admin</small></button>
          <button data-cmd="shortcut" role="menuitem"><svg class="i"><use href="#i-link"/></svg>Desktop shortcut</button>
          <button data-cmd="openLogs" role="menuitem"><svg class="i"><use href="#i-folder"/></svg>Open build folder</button>
          <hr>
          <button data-cmd="config" role="menuitem"><svg class="i"><use href="#i-cog"/></svg>Open config.json</button>
        </div>
      </div>
      <div class="strip">
        ${cell('i-lobby', 'Lobby', lob[1], lob[0], b.lobbyWhy)}
        ${cell('i-match', 'Local match', mat[1], mat[0], b.matchServer ? b.matchWhy : 'launcher\\gameserver\\radarnite-server.dll is missing')}
        ${cell('i-cos', 'Cosmetics', b.cosmetics ? b.cosmetics.toLocaleString('en') : 'Missing', b.cosmetics ? 'ok' : 'warn', 'Read from the build\'s own data')}
        ${cell('i-fw', 'Firewall', fwOk ? '127.0.0.1 only' : 'Missing', fwOk ? 'ok' : 'bad', fwOk ? 'Every exe of the build is blocked from the internet' : b.firewall)}
      </div>
    </section>
    ${notices.map(([cls, html, action]) => `<div class="notice ${cls}"><svg class="i"><use href="#i-warn"/></svg><div>${html}</div>${action}</div>`).join('')}
    <section class="card${b.lobby === 'No' ? ' dis' : ''}">
      <div class="sect"><span class="lbl">Modes</span>${hasMatch ? `<div class="modes two">${modeCards}</div>
        <div class="mhint">In the game's lobby press <b>CHANGE</b>, pick a mode, then <b>PLAY</b>. The match server for it starts by itself.</div>`

    .map(([k, l, n]) => { const on = k === 'all' ? !P.types.size : P.types.size === 1 && P.types.has(k); return `<span class="chip${on ? ' on' : ''}${n ? '' : ' z'}" data-pcat="${k}" role="button" tabindex="0" aria-pressed="${on}">${PIC[k]}${l}<b class="n">${n}</b></span>`; }).join('');
  $('#pcbl').textContent = !P.types.size ? 'All' : P.types.size === 1 ? PT[[...P.types][0]] : `${P.types.size} types`;
  const nFil = P.types.size + P.sts.size + P.rars.size;
  $('#pfbn').textContent = nFil || ''; $('#pfpa').textContent = nFil ? `${nFil} on` : '';
  const rars = RAR.filter(([k]) => all.some((it) => (it.rarity || '').toLowerCase() === k));
  $('#pfbody').innerHTML = `<div class="fsec"><h4>Status</h4><div class="fg g4">${STS.map(([k, l]) => `<span class="chip${P.sts.has(k) ? ' on' : ''}${sc[k] ? '' : ' z'}" data-pst="${k}" role="button" tabindex="0">${l}<b class="n">${sc[k] || 0}</b></span>`).join('')}</div></div>
    <div class="fsec"><h4>Type</h4><div class="fg g4">${Object.keys(PT).map((k) => `<span class="chip${P.types.has(k) ? ' on' : ''}${tc[k] ? '' : ' z'}" data-pty="${k}" role="button" tabindex="0">${PT[k]}<b class="n">${tc[k] || 0}</b></span>`).join('')}</div></div>
    ${rars.length ? `<div class="fsec"><h4>Rarity</h4><div class="fg g4">${rars.map(([k, l]) => `<span class="chip rch r-${k}${P.rars.has(k) ? ' on' : ''}${rc[k] ? '' : ' z'}" data-prr="${k}" role="button" tabindex="0">${l}<b class="n">${rc[k] || 0}</b></span>`).join('')}</div></div>` : ''}`;
  const qn = $('#pqnew'); qn.classList.toggle('on', P.sts.size === 1 && P.sts.has('new')); qn.querySelector('b').textContent = sc.new || '';
  document.querySelectorAll('#psortm .opt').forEach((o) => o.setAttribute('aria-selected', o.dataset.sort === P.sort));
  if (P.error) { body.innerHTML = `<div class="notice warn"><svg class="i"><use href="#i-warn"/></svg><div><b>The cosmetics of the current Fortnite cannot be listed.</b> ${esc(P.error)}.</div></div>`; return; }
  const list = P.list = portSorted(all.filter((it) => portMatch(it)));
  const head = portHead();
  const load = P.loading ? renderPortLoad() : '';
  if (!P.items) { body.innerHTML = head + load + `<div class="grid">${Array.from({ length: 18 }, () => '<div class="sk" style="aspect-ratio:198/258;border-radius:14px"></div>').join('')}</div>`; return; }
  if (!list.length) { body.innerHTML = head + load + `<div class="empty">${P.sts.size === 1 && P.sts.has('imported') ? 'Nothing imported yet.' : 'Nothing matches.'}</div>`; return; }
  body.innerHTML = head + load + `<div class="grid" id="pgrid">${list.slice(0, P.shown).map(cardHtml).join('')}</div><div class="more" id="pmore"></div>`;
  portObserve();
}
function renderPortHead() { const h = $('#portBody .sec'); if (h) h.outerHTML = portHead(); }
function portHead() {
  const list = P.list, todo = list.filter(importable), selN = P.sel.size, j = P.job;
  return `<div class="sec"><h2>${P.types.size === 1 ? PT[[...P.types][0]] : 'All cosmetics'}</h2><span class="sm">${P.items ? `${nf(list.length)} items` : ''}</span><span class="sp"></span>
    ${selN ? `<button class="fclr" data-cmd="portClear">Clear</button>` : ''}
    <button class="chip" data-cmd="portImportSel"${!selN || j ? ' disabled' : ''}>Import selected${selN ? `<b class="n">${selN}</b>` : ''}</button>
    ${todo.length ? `<button class="chip on" data-cmd="portImportAll"${j ? ' disabled' : ''}>Import all ${nf(todo.length)}…</button>` : ''}</div>`;
}
// infinite scroll, as the web: the next page is added when the end of the grid comes near
let portIO = null;
function portObserve() {
  portIO?.disconnect();
  const m = $('#pmore'); if (!m || P.shown >= P.list.length) return;
  portIO = new IntersectionObserver((es) => {
    if (!es.some((e) => e.isIntersecting) || P.shown >= P.list.length) return;
    const from = P.shown; P.shown += PAGE;
    $('#pgrid').insertAdjacentHTML('beforeend', P.list.slice(from, P.shown).map(cardHtml).join(''));
    if (P.shown >= P.list.length) portIO.disconnect();
  }, { root: $('#portBody'), rootMargin: '0px 0px 1200px 0px' });
  portIO.observe(m);
}
function portRefilter() { P.shown = PAGE; renderPort(); $('#portBody').scrollTop = 0; }
function popOpen(btn) {
  const id = btn.dataset.pop, pnl = $('#' + id), was = pnl.classList.contains('on');
  popClose(); if (was) return;
  const pr = $('#port').getBoundingClientRect(), r = btn.getBoundingClientRect();
  pnl.classList.add('on'); btn.setAttribute('aria-expanded', 'true'); $('#pscrim').classList.add('on');
  const w = pnl.offsetWidth, left = Math.min(Math.max(8, r.left - pr.left), pr.width - w - 8);
  pnl.style.top = `${r.bottom - pr.top + 8}px`; pnl.style.left = `${id === 'psortm' ? Math.max(8, r.right - pr.left - w) : left}px`;
}
function popClose() { document.querySelectorAll('.port .pnl.on').forEach((p) => p.classList.remove('on')); document.querySelectorAll('.port [data-pop]').forEach((b) => b.setAttribute('aria-expanded', 'false')); $('#pscrim')?.classList.remove('on'); }
function portConfirm(items, all) {
  const e = estimate(items), b = sel(), over = items.length > P.slotsFree;
  $('#dlg').innerHTML = `<h3>Import ${nf(items.length)} cosmetic${items.length === 1 ? '' : 's'} into ${esc(b?.version || '')}?</h3>
    <p>${all ? 'Every cosmetic shown that is not imported yet.' : 'The cosmetics you picked.'} They are converted from the Fortnite installed on this PC and added as new items. It runs in the background at low priority; you can stop it and import again later to continue.</p>
    <div class="nums"><div><b>${nf(items.length)}</b><span>items</span></div><div><b>~${fmtGB(e.gb)}</b><span>disk (estimate)</span></div><div><b>~${fmtH(e.h)}</b><span>time (estimate)</span></div></div>
    ${over ? `<div class="mnote warn"><svg class="i"><use href="#i-warn"/></svg><span><b>Only ${nf(P.slotsFree)} more items fit in this build</b> (one pak slot each). The import stops when they run out.</span></div>` : ''}
    <div class="row"><button class="btn ghost" data-cmd="dlgCancel">Cancel</button><button class="btn pri" data-cmd="dlgImport">Import</button></div>`;
  P.pending = items.map((it) => it.path);
  $('#modal').classList.add('open'); $('#dlg .btn.pri').focus();
}
// timers of the import and of the catalog loading keep counting between the host's updates
setInterval(() => { if (!P.open) return; if (P.job) safe('import', renderPortJob); if (P.loading && $('.pload')) { const l = $('.pload'); l.outerHTML = renderPortLoad(); } }, 1000);

/* ---------- state ---------- */
// Each part renders on its own: a bug in one never blanks the others; script errors go to Activity and to
// launcher\ui-error.log through the host.
function safe(name, f) { try { f(); } catch (e) { reportError(`${name}: ${e && e.message || e}`); } }
function reportError(text) { send('jsError', { text }); addLog('Error: the window could not draw part of itself (' + text + '). Details in launcher\\ui-error.log.', 'bad'); }
window.addEventListener('error', (e) => reportError(`${e.message} (${e.lineno}:${e.colno})`));
function render() { safe('builds', renderRail); safe('build', renderContent); safe('launch bar', renderBar); safe('activity', renderLogs); const fw = S.builds?.length && S.builds.every((x) => x.firewall === 'OK');
  $('#tbSafe').innerHTML = S.builds?.length ? `<span class="dot ${fw ? 'ok' : 'warn'}"></span>${fw ? 'Offline · 127.0.0.1 only' : 'Firewall rules missing'}` : ''; }
function setConfig(patch) { Object.assign(S.config, patch); send('saveConfig', { config: patch }); renderContent(); renderBar(); }
function greet() { const p = $('#play'); p.classList.remove('greet'); void p.offsetWidth; p.classList.add('greet'); setTimeout(() => p.classList.remove('greet'), 3000); }

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-toggle]');
  document.querySelectorAll('.menu.open').forEach((m) => { if (!t || m.id !== t.dataset.toggle) m.classList.remove('open'); });
  if (t) { $('#' + t.dataset.toggle).classList.toggle('open'); return; }
  const w = e.target.closest('[data-win]'); if (w) return send('win', { op: w.dataset.win });
  const c = e.target.closest('[data-cmd]');
  if (c) {
    const cmd = c.dataset.cmd;
    if (cmd === 'copyLog') { navigator.clipboard?.writeText(S.logs.map((l) => `${l.ts} ${l.text}`).join('\n')); toast('Activity copied', 'info'); return; }
    if (cmd === 'clearLog') { S.logs = []; renderLogs(); return; }
    if (cmd === 'portOpen') return portOpen();
    if (cmd === 'portClose') return portClose();
    if (cmd === 'portRefresh') return portLoad(true);
    if (cmd === 'portPopClose') return popClose();
    if (cmd === 'portClearFilters') { P.types.clear(); P.sts.clear(); P.rars.clear(); return portRefilter(); }
    if (cmd === 'portClear') { P.sel.clear(); return renderPort(); }
    if (cmd === 'portStop') return send('portCancel');
    if (cmd === 'portImportSel') return portConfirm((P.items || []).filter((it) => P.sel.has(it.path)), false);
    if (cmd === 'portImportAll') return portConfirm(P.list.filter(importable), true);
    if (cmd === 'dlgCancel') { $('#modal').classList.remove('open'); return; }
    if (cmd === 'dlgImport') { $('#modal').classList.remove('open'); P.sel.clear(); send('portImport', { build: P.build, paths: P.pending || [] }); return; }
    return send(cmd, { build: S.selected });
  }
  const pop = e.target.closest('.port [data-pop]'); if (pop) return popOpen(pop);
  if (e.target.id === 'pscrim') return popClose();
  const pc = e.target.closest('[data-pcat]');
  if (pc) { P.types.clear(); if (pc.dataset.pcat !== 'all') P.types.add(pc.dataset.pcat); popClose(); return portRefilter(); }
  const tg = (set, k) => { set.has(k) ? set.delete(k) : set.add(k); portRefilter(); };
  const pst = e.target.closest('[data-pst]'); if (pst) return tg(P.sts, pst.dataset.pst);
  const pty = e.target.closest('[data-pty]'); if (pty) return tg(P.types, pty.dataset.pty);
  const prr = e.target.closest('[data-prr]'); if (prr) return tg(P.rars, prr.dataset.prr);
  if (e.target.closest('#pqnew')) { const on = P.sts.size === 1 && P.sts.has('new'); P.sts.clear(); if (!on) P.sts.add('new'); return portRefilter(); }
  const so = e.target.closest('[data-sort]'); if (so) { P.sort = so.dataset.sort; popClose(); return portRefilter(); }
  const pi = e.target.closest('[data-pi]');
  if (pi) {
    const k = pi.dataset.pi, it = byPath().get(k);
    if (it && importable(it)) { P.sel.has(k) ? P.sel.delete(k) : P.sel.add(k); const on = P.sel.has(k); pi.classList.toggle('sel', on); const q = pi.querySelector('.qb'); q?.classList.toggle('on', on); q?.setAttribute('aria-pressed', on); renderPortHead(); }
    return;
  }
  const bi = e.target.closest('[data-build]');
  if (bi && !busy()) { if (P.open && bi.dataset.build !== P.build) portClose(); S.selected = bi.dataset.build; try { localStorage.setItem('lastBuild', S.selected); } catch {} send('select', { build: S.selected }); render(); greet(); return; }
  const m = e.target.closest('[data-mode]');
  if (m && m.getAttribute('aria-disabled') !== 'true') return setConfig({ mode: m.dataset.mode });
  const f = e.target.closest('[data-flag]');
  if (f && f.getAttribute('aria-disabled') !== 'true') return setConfig({ [f.dataset.flag]: !S.config[f.dataset.flag] });
  const sp = e.target.closest('[data-step]');
  if (sp) return setConfig({ bots: Math.max(0, Math.min(99, (+S.config.bots || 0) + +sp.dataset.step)) });
  const fl = e.target.closest('[data-f]');
  if (fl) { S.filter = fl.dataset.f; document.querySelectorAll('#filters button').forEach((x) => x.classList.toggle('on', x === fl)); renderLogs(); }
});
document.addEventListener('change', (e) => {
  if (e.target.id === 'name') { const v = e.target.value.trim(); if (v) setConfig({ displayName: v }); else e.target.value = S.config.displayName || ''; }
  if (e.target.id === 'bots') setConfig({ bots: Math.max(0, Math.min(99, parseInt(e.target.value) || 0)) });
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { if ($('#modal').classList.contains('open')) $('#modal').classList.remove('open'); else if (document.querySelector('.port .pnl.on')) popClose(); else if (P.open && !document.querySelector('.menu.open')) portClose(); document.querySelectorAll('.menu.open').forEach((m) => m.classList.remove('open')); }
  if (e.key === 'Enter' && e.ctrlKey && !$('#play').disabled) $('#play').click();
  if (e.key === 'l' && e.ctrlKey) { e.preventDefault(); toggleActivity(); }
  if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && e.target.closest('#list') && S.builds?.length && !busy()) {
    const i = S.builds.findIndex((b) => b.name === S.selected), j = Math.max(0, Math.min(S.builds.length - 1, i + (e.key === 'ArrowDown' ? 1 : -1)));
    S.selected = S.builds[j].name; send('select', { build: S.selected }); render(); $(`#list [data-build="${CSS.escape(S.selected)}"]`)?.focus(); e.preventDefault();
  }
});
document.addEventListener('keydown', (e) => { if (e.altKey && e.code === 'Space') { e.preventDefault(); send('win', { op: 'sysmenu' }); } });
$('#q').oninput = (e) => { S.q = e.target.value; renderLogs(); };
$('#pq').oninput = (e) => { P.q = e.target.value; portRefilter(); };
$('#actBtn').onclick = () => toggleActivity();
$('#play').onclick = () => { if (S.session.state === 'launching' || S.session.state === 'running') send('stop'); else if (S.selected) send('launch', { build: S.selected }); };
// activity height: drag the top edge; remembered per viewer
(() => { const g = $('#grip'), a = $('#activity'); try { const h = localStorage.getItem('actH'); if (h) a.style.setProperty('--act-h', h); } catch {}
  g.onpointerdown = (e) => { g.setPointerCapture(e.pointerId); const y0 = e.clientY, h0 = a.offsetHeight;
    g.onpointermove = (m) => { const h = Math.max(140, Math.min(innerHeight * .7, h0 + y0 - m.clientY)) + 'px'; a.style.setProperty('--act-h', h); try { localStorage.setItem('actH', h); } catch {} };
    g.onpointerup = () => { g.onpointermove = null; }; }; })();

function onMessage(m) {
  if (m.type === 'state') {
    const first = !S.builds;
    S.builds = m.builds; S.config = m.config; S.root = m.root || S.root;
    if (m.session) S.session = m.session;
    if (!S.selected || !m.builds.some((b) => b.name === S.selected)) {
      // the host's selection, else the build picked last time on this PC, else the newest build
      let last = null; try { last = localStorage.getItem('lastBuild'); } catch {}
      const has = (n) => n && m.builds.some((b) => b.name === n);
      S.selected = has(m.selected) ? m.selected : has(last) ? last : m.builds[m.builds.length - 1]?.name || null;
    }
    render(); if (first) greet();
  } else if (m.type === 'session') {
    const was = S.session.state; S.session = m.session; renderBar();
    if (m.session.state === 'error' && was !== 'error') { toast(m.session.message || 'Launch failed', 'bad'); toggleActivity(true); }
    if (m.session.state === 'idle' && was !== 'idle') greet();
    renderRail();
  } else if (m.type === 'log') addLog(m.text, m.level, m.ts);
  else if (m.type === 'window') { document.body.classList.toggle('max', !!m.maximized); document.body.classList.toggle('inactive', m.active === false); }
  else if (m.type === 'toast') toast(m.text, m.level || 'info');
  else if (m.type === 'portCatalog') {
    const c = m.catalog || {};
    if (c.build !== P.build) return;
    // fortnite-api's list first (partial: no source paths yet), then fn-port's
    P.partial = !!c.partial; P.loading = P.partial; P.error = c.error || ''; P.items = c.items || null; if (!P.partial) P.slotsFree = c.slotsFree ?? 0;
    if (!P.partial) P.sel.forEach((k) => { if (!byPath().has(k)) P.sel.delete(k); });
    renderPort();
  } else if (m.type === 'portLoad') {
    if (m.build !== P.build) return;
    P.load[m.stage] = { at: P.load[m.stage]?.at || Date.now(), ms: m.ms || P.load[m.stage]?.ms || 0, done: m.done };
    renderPort();
  } else if (m.type === 'portJob') {
    const was = P.job; P.job = m.job; P.jobAt = Date.now();
    if (was && !m.job && P.open) portLoad(false); else if (P.open) { if (!was !== !m.job) renderPort(); else renderPortJob(); }
    if (!P.open) safe('build', renderContent);
  }
}
window.chrome?.webview?.addEventListener('message', (e) => onMessage(e.data));
window.__fnoffline = onMessage; // used by the static preview tests
render();
send('ready');
